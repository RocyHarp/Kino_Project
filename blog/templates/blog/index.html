{% extends 'blog/base.html' %}
{% block content %}
    <h2>Огляд фільмів</h2>
    {% for post in posts %}
        <div>
            <h3>{{ post.title }}</h3>
            <p>{{ post.content|truncatewords:20 }}</p>
        </div>
    {% empty %}
        <p>Ще немає фільмів.</p>
    {% endfor %}
{% endblock %}
